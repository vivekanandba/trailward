name: CI

# Validates every pull request so the /ship review loop can gate a merge on
# green checks. Deploy stays in deploy.yml (runs only on push to main).
on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A spec validator can only check the specs that EXIST — it structurally
      # cannot see the one that is missing. /ship asks for a spec with every
      # behaviour change, but that is honoured by the author; this enforces it
      # for the files where a missing spec has actually cost us (spec 37).
      - name: Spec discipline
        run: bash scripts/check-spec-discipline.sh "origin/${{ github.base_ref || 'main' }}"
      - run: npm run lint
      - run: npm run format:check

  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs the suite with coverage; thresholds in vite.config.ts gate regressions.
      - run: npm run coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache the Playwright browser download across runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # App projects only (desktop chromium + Pixel-7). The static-surface
      # project needs a full production build and runs as its own job, so a
      # smoke-test failure is never queued behind 3,886 generated pages.
      - run: npm run e2e -- --project=chromium --project=mobile
      # Failing visual diffs (-actual/-diff/-expected PNGs) and traces are
      # useless if discarded — surface them on every run outcome (spec 33).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.job }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-static:
    # The generated crawl surface (spec 35): trek pages, robots, sitemap,
    # served by `vite preview` from a real production build at the real base
    # path. Separate job because it pays for that build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.job }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
