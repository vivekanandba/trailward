name: Deploy to GitHub Pages

# Publishes only if BOTH the data validates AND tests pass (unit + e2e).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Constitution
        run: npm run check:constitution
        env:
          CONSTITUTION_TOKEN: ${{ secrets.CONSTITUTION_TOKEN }}
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Same gate as ci.yml — coverage thresholds live in vite.config.ts.
      - run: npm run coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # App projects only (desktop chromium + Pixel-7). The static-surface
      # project needs a full production build and runs as its own job, so a
      # smoke-test failure is never queued behind 3,886 generated pages.
      - run: npm run e2e -- --project=chromium --project=mobile
      # Failing visual diffs (-actual/-diff/-expected PNGs) and traces are
      # useless if discarded — surface them on every run outcome (spec 33).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.job }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-static:
    # The generated crawl surface (spec 35): trek pages, robots, sitemap,
    # served by `vite preview` from a real production build at the real base
    # path. Separate job because it pays for that build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.job }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: [quality, validate-data, test, e2e, e2e-static]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # CON-COV-001: "after deploying, assert the running version equals the
  # version just built". Nothing did this — the deploy was the one step in the
  # whole pipeline with no gate, on a project whose entire output IS the
  # deployed site. This asserts the live version.json carries THIS commit, and
  # that the crawl surface and a generated trek page are really being served
  # (a 200 is not enough: the SPA shell as a soft 404 passes a status check).
  verify-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert the live site serves this build
        run: npm run check:deploy -- --sha "$GITHUB_SHA" --previous "$PREVIOUS_SHA"
        env:
          GITHUB_SHA: ${{ github.sha }}
          # The commit this push replaced. Distinguishes "the CDN has not
          # turned over yet" (retry) from "something else is deployed" (fail).
          PREVIOUS_SHA: ${{ github.event.before }}
