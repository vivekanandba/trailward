name: Update visual baselines

# Screenshot baselines must be generated in the SAME environment that verifies
# them. Font rasterization differs between a local container and the CI runner
# — different freetype/fontconfig — so locally-generated baselines fail in CI
# with a whole-page text diff that no tolerance can honestly absorb (spec 33).
#
# CI is the authority (CON-VER-004), so CI produces the baselines. Run this
# manually after an intentional UI change, then re-run the PR checks.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update baselines on
        required: true

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-24.04 # pinned with the baselines: spec 42 §E
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          # The static pages' "Data as of" comes from the data's last commit
          # (spec 44 R5): full history, no file contents.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The data's date, read once with the full history (spec 44 R5)
        run: echo "TRAILWARD_DATA_DATE=$(git log -1 --format=%cs -- src/data/treks.json)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/playwright-setup
      # Both suites carry screenshots: visual.spec.ts covers the app states,
      # static.spec.ts the generated pages served by `vite preview` (spec 42 §C).
      # =all: plain --update-snapshots rewrites only screenshots that FAIL, so
      # drift inside the 1% tolerance (⌘K vs Ctrl K) was never refreshed and
      # "Baselines already match" was reported over a stale image (spec 42 §E).
      # Two passes, as `npm run e2e` runs them: the static project's full
      # build starves the dev server when they share one (playwright.config.ts).
      - run: npx playwright test --project=chromium --project=mobile visual.spec.ts --update-snapshots=all
      - run: npx playwright test --project=static static.spec.ts --update-snapshots=all
      - name: Commit refreshed baselines if changed
        run: |
          if [[ -n "$(git status --porcelain e2e/__screenshots__)" ]]; then
            git config user.name "trailward-bot"
            git config user.email "actions@github.com"
            git add e2e/__screenshots__
            git commit -m "chore(visual): refresh baselines from CI

          Generated on the runner, which is the environment that verifies them —
          local font rasterization differs and produces a whole-page text diff."
            git push
          else
            echo "Baselines already match this environment."
          fi
