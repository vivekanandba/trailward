name: Weekly data refresh

# Re-runs the data pipeline weekly, commits treks.json if it changed.
# The push then triggers the gated deploy workflow. No server involved.
on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch: # manual "run now"

permissions:
  contents: write
  issues: write # to file a failed run where someone will see it

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:data
      - run: npm run build:discovery
      - run: npm run validate:data
      # A rebake can "succeed" while silently stripping enrichment (spec 31) —
      # refuse to commit if any field count regressed vs the committed data.
      - run: npx tsx scripts/check-enrichment-drift.ts
      - run: npm run build:chunks
      - name: Commit refreshed data if changed
        run: |
          if [[ -n "$(git status --porcelain src/data/treks.json public/data)" ]]; then
            git config user.name "trailward-bot"
            git config user.email "actions@github.com"
            git add src/data/treks.json public/data
            git commit -m "chore(data): weekly refresh of treks.json"
            git push
          else
            echo "No data changes this run."
          fi
      - name: File the failure where it will be seen
        # Every run from 2026-08-10 to 2026-10-26 failed on the drift guard and
        # nobody looked: a red scheduled run emails only whoever last edited the
        # cron. One open issue, with a comment per further failure (spec 10).
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly data refresh is failing"
          body="The weekly data refresh failed and committed nothing: $RUN_URL (spec 10)."
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
