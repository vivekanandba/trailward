name: Weekly data refresh

# Re-runs the data pipeline weekly, commits treks.json if it changed.
# The push then triggers the gated deploy workflow. No server involved.
on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch: # manual "run now"

permissions:
  contents: write
  actions: write # dispatch the deploy for what landed

# The two workflows that write treks.json never run at once: it is one line,
# so any overlap is a certain conflict and a lost run (spec 10).
concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:data
      - run: npm run build:discovery
      - run: npm run validate:data
      # A rebake can "succeed" while silently stripping enrichment (spec 31) —
      # refuse to commit if any field count regressed vs the committed data.
      - run: npx tsx scripts/check-enrichment-drift.ts
      - run: npm run build:chunks
      # Record a URL for every new page; never move an existing one (spec 35).
      - run: npm run build:slugs
      # Lands on whatever main became while this ran: if it moved, the data is
      # re-derived and re-checked on top of it first (spec 10).
      - name: Commit refreshed data if changed
        id: land
        run: >-
          scripts/push-data.sh "chore(data): weekly refresh of treks.json"
          "npm ci && npm run build:chunks && npm run build:slugs && npm run validate:data && npx tsx scripts/check-enrichment-drift.ts"
          src/data/treks.json public/data scripts/pages
      # A push with the workflow's own token starts no other workflow, so the
      # data would sit on main unpublished until a person pushed; a dispatch
      # does start one (spec 10, spec 09).
      - name: Publish what landed
        if: steps.land.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  # A red scheduled run emails only whoever last edited the cron (spec 10):
  # file a failure, close the issue on the next success.
  report-failure:
    needs: refresh
    # Only main's runs speak for production; a dispatch on a branch does not.
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "Weekly data refresh is failing"
      result: ${{ needs.refresh.result }}
