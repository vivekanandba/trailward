# Applies community name suggestions (GitHub issues labelled `name-suggestion`)
# to the data (spec 29): validates each, renames the pin with provenance,
# commits, and closes the issue. Runs the day before the weekly data refresh so
# fresh names ride the same deploy; also on demand.
name: Apply name suggestions

on:
  schedule:
    - cron: "0 2 * * 0" # Sundays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch the deploy for what landed
  issues: write

# The two workflows that write treks.json never run at once: it is one line,
# so any overlap is a certain conflict and a lost run (spec 10).
concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run apply:names
        env:
          GH_TOKEN: ${{ github.token }}
      # Chunks, and a URL for a named pin that earns a page (spec 35); the same
      # npm script the landing step reruns on top of a moved main.
      - run: npm run derive:data
      # Lands on whatever main became while this ran: if it moved, the data is
      # re-derived and re-checked on top of it first (spec 10).
      - name: Commit applied names
        id: land
        run: >-
          scripts/push-data.sh "chore(names): apply community name suggestions"
          "npm ci && npm run derive:data && npm run validate:data"
          scripts/detected src/data/treks.json -- public/data scripts/pages
      # A push with the workflow's own token starts no other workflow, so the
      # data would sit on main unpublished until a person pushed; a dispatch
      # does start one (spec 10, spec 09).
      - name: Publish what landed
        if: steps.land.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  # A red scheduled run emails only whoever last edited the cron (spec 10):
  # file a failure, close the issue on the next success.
  report-failure:
    needs: apply
    # Only main's runs speak for production; a dispatch on a branch does not.
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "Applying name suggestions is failing"
      result: ${{ needs.apply.result }}
