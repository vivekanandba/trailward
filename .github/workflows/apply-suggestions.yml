# Applies community name suggestions (GitHub issues labelled `name-suggestion`)
# to the data (spec 29): validates each, renames the pin with provenance,
# commits, and closes the issue. Runs the day before the weekly data refresh so
# fresh names ride the same deploy; also on demand.
name: Apply name suggestions

on:
  schedule:
    - cron: "0 2 * * 0" # Sundays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run apply:names
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build:chunks
      # A named pin may earn a page; record its URL (spec 35).
      - run: npm run build:slugs
      - name: Commit applied names
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "trailward-bot"
            git config user.email "actions@github.com"
            git add scripts/detected src/data/treks.json public/data scripts/pages
            git commit -m "chore(names): apply community name suggestions"
            # A long run outlives merges to main: replay this commit on top of
            # them, so the push is not rejected (spec 10). A conflict fails here,
            # loudly, and the reporter files it.
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
              git push && break # a push race: pull again and retry
              [ "$attempt" = 3 ] && exit 1
              sleep 10
            done
          else
            echo "No suggestions applied."
          fi

  # A red scheduled run emails only whoever last edited the cron (spec 10):
  # file a failure, close the issue on the next success.
  report-failure:
    needs: apply
    # Only main's runs speak for production; a dispatch on a branch does not.
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "Applying name suggestions is failing"
      result: ${{ needs.apply.result }}
