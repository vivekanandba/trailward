name: Weekly link check

# Link rot is time-based, not PR-based: a source dies when somebody else's
# site changes, long after the merge that added it. Nothing in the PR gates
# can see that, so this runs on a schedule (spec 37). Advisory — it reports,
# it never blocks.
on:
  schedule:
    - cron: "0 3 * * 2" # Tuesdays 03:00 UTC, off the data-refresh day
  workflow_dispatch:

permissions:
  contents: read

# A weekly job: a second run waits rather than racing the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  links:
    # Runs take about 170 min (2026-10 runs: 168-171); the default is 6 hours.
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Writes its summary to the run summary, where a human will actually
      # see it — an advisory step that merely goes green is useless.
      - run: npm run check:links -- --all

  # A red scheduled run emails only whoever last edited the cron (spec 10):
  # file a failure, close the issue on the next success.
  report-failure:
    needs: links
    # Only main's runs speak for production; a dispatch on a branch does not.
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "Weekly link check is failing"
      result: ${{ needs.links.result }}
